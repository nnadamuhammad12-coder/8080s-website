<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initiatives — Muhammad Nada</title><meta name="description" content="Initiatives by Muhammad Nada: Nuri, Alchemy, Rowad, TDF+, Beltone, LOGIC, MUN and Outreach.">
<style>
:root{--paper:#fafaf8;--ink:#171817;--muted:#838581;--grid:rgba(90,90,80,.037);--line:#c8c9c3;--panel:#fafaf8;--face:34,35,33}
body[data-theme=blue]{--paper:#0e9aaa;--panel:#14a7b7;--grid:rgba(255,255,255,.08);--line:#7fd3dc;--face:255,255,255;--ink:#ffffff;--muted:#c9eff3}
body[data-theme=yellow]{--paper:#efe5a5;--panel:#f4edbc;--grid:rgba(70,50,0,.05);--line:#b9ac6b;--face:53,45,13}
body[data-theme=red]{--paper:#efb7ae;--panel:#f4c5bd;--grid:rgba(80,20,10,.05);--line:#bd847c;--face:58,24,20;--ink:#ffffff;--muted:#f8e65e}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background-color:var(--paper);color:var(--ink);font:13px/1.55 'Courier New',monospace;overflow:hidden;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:8px 8px}
a{color:inherit;text-decoration:none}
.frame{position:fixed;inset:24px;border:1px solid var(--grid);pointer-events:none}
.brand{position:fixed;top:30px;left:36px;font-size:17px;z-index:3}
.back{position:fixed;top:33px;left:max(15%,200px);font-size:11px;color:var(--muted);z-index:3}
.topnav{position:fixed;top:34px;right:36px;display:flex;gap:18px;font-size:12px;color:var(--muted);z-index:3}
.topnav a:hover,.back:hover{color:var(--ink)}
.intro{position:fixed;left:15%;top:50%;transform:translateY(-50%);max-width:250px;z-index:3}
.intro h1{font-size:28px;letter-spacing:-1.2px;font-weight:400;margin:0 0 14px}
.intro p{color:var(--muted);margin:0 0 22px}
.intro ol{list-style:none;padding:0;margin:0;counter-reset:i}
.intro li{counter-increment:i;margin:2px 0}
.intro li a{display:inline-flex;gap:10px;color:var(--muted)}
.intro li a::before{content:counter(i,decimal-leading-zero);opacity:.6}
.intro .note{margin:26px 0 0;font-size:10.5px;line-height:1.6;color:var(--muted);max-width:270px}.intro li a.sub{margin-left:10px;font-size:11px}.intro li a.sub::before{content:none}.intro li a:hover,.intro li a[data-hot]{color:var(--ink)}
.stage{position:fixed;inset:0;left:28%}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none}
.lab{pointer-events:auto;position:absolute;transform:translate(-50%,-50%);padding:4px 10px;font:11px 'Courier New',monospace;white-space:nowrap;border:1px solid var(--line);border-radius:2px;background:var(--panel);color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
.lab:hover,.lab[data-hot]{background:var(--ink);color:var(--paper);z-index:9}
.lab.soon::after{content:'coming soon';position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);font-size:9px;color:var(--muted);background:var(--paper);padding:0 4px}
.choices{position:absolute;transform:translateX(-50%);display:grid;gap:4px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:2px;z-index:20;pointer-events:auto;min-width:170px}.choices a{display:flex;justify-content:space-between;gap:14px;padding:5px 8px;font-size:11px;color:var(--ink)}.choices a small{color:var(--muted);font-size:9px}.choices a:hover{background:var(--ink);color:var(--paper)}.choices a:hover small{color:var(--paper)}.intro li a.nolink{cursor:default}.intro li a.nolink:hover{color:var(--muted)}.hint{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
@media (max-width:760px){.intro{top:96px;transform:none;left:36px}.stage{left:0;top:240px}}
